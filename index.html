<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Generate printable STL files from terrain, photos, text and parametric models.">
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Layerworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&family=Archivo+Black&family=Bebas+Neue&family=Pacifico&family=Roboto+Slab:wght@800&family=Permanent+Marker&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAE7; --panel:#F7F9F7; --panel-2:#EDF1EE; --ink:#16201A; --muted:#58645D; --line:#D0D8D2;
  --accent:#2B62D4; --accent-ink:#FFFFFF; --accent-soft:#DDE7FB;
  --stage:#DCE2DE; --stage-2:#C3CCC6; --hud:rgba(247,249,247,.82);
  --plate:#B48E43; --plate-line:#7E6128; --frame:#3A403C;
  --ok:#1F7A4A; --ok-soft:#DCF0E3; --warn:#9A5B00; --warn-soft:#F8EAD2; --bad:#B42F2F; --bad-soft:#F8DEDE;
  --f-ui:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101412; --panel:#171C19; --panel-2:#1E2420; --ink:#E4EAE6; --muted:#95A29A; --line:#2A332E;
    --accent:#7AA3F5; --accent-ink:#0A1428; --accent-soft:#1D2A45;
    --stage:#1C2320; --stage-2:#0B0E0D; --hud:rgba(23,28,25,.82);
    --plate:#8F7234; --plate-line:#3E3014; --frame:#0A0C0B;
    --ok:#6FD39C; --ok-soft:#173726; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#F08A8A; --bad-soft:#3E1B1B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101412; --panel:#171C19; --panel-2:#1E2420; --ink:#E4EAE6; --muted:#95A29A; --line:#2A332E;
  --accent:#7AA3F5; --accent-ink:#0A1428; --accent-soft:#1D2A45;
  --stage:#1C2320; --stage-2:#0B0E0D; --hud:rgba(23,28,25,.82);
  --plate:#8F7234; --plate-line:#3E3014; --frame:#0A0C0B;
  --ok:#6FD39C; --ok-soft:#173726; --warn:#F0B35A; --warn-soft:#3A2A10; --bad:#F08A8A; --bad-soft:#3E1B1B;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:16px;padding-inline:16px;padding-block:16px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 14px}
.brand svg{flex:none}
.brand h1{margin:0;font-size:22px;line-height:1;font-weight:800;font-stretch:125%;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px;letter-spacing:.02em}

.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 14px 12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.cat svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cat:hover{color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.cat[aria-pressed="true"] svg{stroke:var(--accent)}

.models{display:flex;flex-wrap:wrap;gap:6px;padding:4px 18px 14px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.params{padding:6px 18px 8px;display:flex;flex-direction:column;gap:12px}
.group{margin-top:10px;font-size:11px;font-weight:700;font-stretch:112%;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:6px}
.row>label,.row .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.row .num{width:84px;text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 4px}
.row .num:hover,.row .num:focus{border-color:var(--line);background:var(--panel-2)}
.unit{color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-left:2px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
select,input[type=text],input[type=search],textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{resize:vertical;min-height:62px}
.check{flex-direction:row;align-items:center;gap:10px;font-size:13px;font-weight:500;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.file{display:flex;gap:8px;align-items:center}
.file .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.search{display:flex;gap:6px}
.results{display:flex;flex-direction:column;gap:2px}
.results button{text-align:left;border:0;background:transparent;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12.5px;line-height:1.35}
.results button:hover{background:var(--panel-2)}
.results .co{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.status{margin:0;font-size:12px;color:var(--muted)}
.status.err{color:var(--bad)}
.status.ok{color:var(--ok)}
.presets{display:flex;flex-wrap:wrap;gap:6px}

.readout{margin:8px 18px 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.readout:empty{display:none}
.readout dt{color:var(--muted)}
.readout dd{margin:0;text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.tips{margin:12px 18px 18px;padding:10px 12px;border-radius:8px;background:var(--panel-2);color:var(--muted);font-size:12.5px;line-height:1.5}
.tips:empty{display:none}
.tips b{color:var(--ink);font-weight:600}

.stage-wrap{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.stage{position:relative;flex:1;min-height:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse 80% 70% at 50% 35%,var(--stage),var(--stage-2))}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
.title{background:var(--hud);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;max-width:100%}
.title strong{font-weight:700;font-stretch:112%;font-size:15px}
.pill{font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--hud);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:6px}
.actions select{width:auto;padding:6px 8px;font-size:12.5px}
.swatches{display:flex;gap:4px;padding:0 4px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.primary:hover{filter:brightness(1.06)}
.primary:disabled{opacity:.55;cursor:progress}
.primary svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.busy{position:absolute;left:12px;bottom:12px;background:var(--hud);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.busy::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{position:absolute;left:12px;right:12px;bottom:12px;margin:auto;max-width:560px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.msg button{background:none;border:0;color:inherit;cursor:pointer;font-weight:700}
.toast{position:absolute;right:12px;bottom:12px;background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 14px;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.stat{display:flex;flex-direction:column;gap:1px}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.stats .pill{margin-left:auto}
.hint{font-size:11.5px;color:var(--muted)}
.mtools{display:none}

@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:1fr}
  .stage-wrap{order:-1}
  .stage{flex:none;height:62svh;min-height:340px}
  .side{overflow:visible}
  .stats .pill{margin-left:0}
  .mtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
  .mtools select{flex:1;min-width:0;width:auto;padding:6px 8px;font-size:12.5px}
  .actions{padding:4px}
}
@media (prefers-reduced-motion:reduce){.busy::before{animation:none}}
</style>

<div class="app">
  <aside class="side" aria-label="Model settings">
    <header class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="3" y="24" width="28" height="5" rx="1.5" fill="var(--accent)"/>
        <rect x="6" y="17" width="22" height="5" rx="1.5" fill="var(--ink)" opacity=".85"/>
        <rect x="9" y="10" width="16" height="5" rx="1.5" fill="var(--ink)" opacity=".6"/>
        <rect x="12" y="3" width="10" height="5" rx="1.5" fill="var(--ink)" opacity=".35"/>
      </svg>
      <div><h1>Layerworks</h1><p>Printable STL generator</p></div>
    </header>
    <nav class="cats" id="cats" aria-label="Model source"></nav>
    <div class="models" id="models" role="group" aria-label="Model type"></div>
    <div class="params" id="params"></div>
    <dl class="readout" id="readout"></dl>
    <div class="tips" id="tips"></div>
  </aside>
  <main class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="view" aria-label="3D preview. Drag to orbit, scroll to zoom."></canvas>
      <div class="hud">
        <div class="title"><strong id="mTitle">Model</strong><span id="mBadge" class="pill" hidden></span></div>
        <div class="actions">
          <select id="printer" aria-label="Printer bed"></select>
          <div class="swatches" id="swatches" role="group" aria-label="Filament color"></div>
          <button id="dl" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Download STL</span></button>
        </div>
      </div>
      <div class="busy" id="busy" hidden>Generating</div>
      <div class="msg" id="msg" hidden><span id="msgText"></span><button id="msgX" aria-label="Dismiss">✕</button></div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="mtools" id="mtools" aria-label="Printer and filament"></div>
  </main>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
/* ===== Layerworks geometry core (no DOM) ===== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const TAU=Math.PI*2;

class TriBuf{
  constructor(cap){this.a=new Float32Array(Math.max(1024,cap|0)*9);this.n=0;}
  t(ax,ay,az,bx,by,bz,cx,cy,cz){
    const o=this.n*9;
    if(o+9>this.a.length){const b=new Float32Array(this.a.length*2);b.set(this.a);this.a=b;}
    const a=this.a;a[o]=ax;a[o+1]=ay;a[o+2]=az;a[o+3]=bx;a[o+4]=by;a[o+5]=bz;a[o+6]=cx;a[o+7]=cy;a[o+8]=cz;this.n++;
  }
  q(a,b,c,d){this.t(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);this.t(a[0],a[1],a[2],c[0],c[1],c[2],d[0],d[1],d[2]);}
  out(){return this.a.slice(0,this.n*9);}
}

function signedVolume(a){
  let v=0;
  for(let o=0;o<a.length;o+=9){
    const ax=a[o],ay=a[o+1],az=a[o+2],bx=a[o+3],by=a[o+4],bz=a[o+5],cx=a[o+6],cy=a[o+7],cz=a[o+8];
    v+=ax*(by*cz-bz*cy)-ay*(bx*cz-bz*cx)+az*(bx*cy-by*cx);
  }
  return v/6;
}
function orientShell(a){
  if(signedVolume(a)<0){
    for(let o=0;o<a.length;o+=9){for(let k=0;k<3;k++){const t=a[o+3+k];a[o+3+k]=a[o+6+k];a[o+6+k]=t;}}
  }
  return a;
}
function transformTris(a,fn){
  const p=[0,0,0];
  for(let o=0;o<a.length;o+=3){p[0]=a[o];p[1]=a[o+1];p[2]=a[o+2];fn(p);a[o]=p[0];a[o+1]=p[1];a[o+2]=p[2];}
  return a;
}
function boxTris(x0,y0,z0,x1,y1,z1){
  const tb=new TriBuf(12);
  const P=(x,y,z)=>[x,y,z];
  const a=P(x0,y0,z0),b=P(x1,y0,z0),c=P(x1,y1,z0),d=P(x0,y1,z0),e=P(x0,y0,z1),f=P(x1,y0,z1),g=P(x1,y1,z1),h=P(x0,y1,z1);
  tb.q(a,d,c,b); tb.q(e,f,g,h); tb.q(a,b,f,e); tb.q(b,c,g,f); tb.q(c,d,h,g); tb.q(d,a,e,h);
  return orientShell(tb.out());
}

/* Remove cells that touch only diagonally (keeps the surface manifold). */
function cleanMask(mask,nx,ny){
  for(let pass=0;pass<4;pass++){
    let changed=false;
    for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
      const k=j*nx+i,a=mask[k],b=mask[k+1],c=mask[k+nx],d=mask[k+nx+1];
      if(a&&d&&!b&&!c){mask[k+1]=1;changed=true;}
      else if(b&&c&&!a&&!d){mask[k]=1;changed=true;}
    }
    if(!changed)break;
  }
}

/* Watertight solid from a height grid.
   H: (nx+1)*(ny+1) vertex heights (z of top surface, bottom at z=0); index j*(nx+1)+i, j = +y.
   mask: optional Uint8Array nx*ny (cell j*nx+i) – cells to include. */
function heightfieldSolid(nx,ny,cell,H,mask){
  if(mask)cleanMask(mask,nx,ny);
  const W=nx+1, tb=new TriBuf(nx*ny*(mask?4:2)+8*(nx+ny)+16);
  const inside=mask?((i,j)=>i>=0&&j>=0&&i<nx&&j<ny&&mask[j*nx+i]):((i,j)=>i>=0&&j>=0&&i<nx&&j<ny);
  for(let j=0;j<ny;j++){
    const y0=j*cell,y1=y0+cell;
    for(let i=0;i<nx;i++){
      if(mask&&!mask[j*nx+i])continue;
      const x0=i*cell,x1=x0+cell;
      const h00=H[j*W+i],h10=H[j*W+i+1],h01=H[(j+1)*W+i],h11=H[(j+1)*W+i+1];
      tb.t(x0,y0,h00, x1,y0,h10, x1,y1,h11);
      tb.t(x0,y0,h00, x1,y1,h11, x0,y1,h01);
      if(mask){tb.t(x0,y0,0, x1,y1,0, x1,y0,0);tb.t(x0,y0,0, x0,y1,0, x1,y1,0);}
      if(!inside(i-1,j))tb.q([x0,y0,0],[x0,y0,h00],[x0,y1,h01],[x0,y1,0]);
      if(!inside(i+1,j))tb.q([x1,y0,0],[x1,y1,0],[x1,y1,h11],[x1,y0,h10]);
      if(!inside(i,j-1))tb.q([x0,y0,0],[x1,y0,0],[x1,y0,h10],[x0,y0,h00]);
      if(!inside(i,j+1))tb.q([x0,y1,0],[x0,y1,h01],[x1,y1,h11],[x1,y1,0]);
    }
  }
  if(!mask){
    const cx=nx*cell/2,cy=ny*cell/2,per=[];
    for(let i=0;i<nx;i++)per.push([i*cell,0]);
    for(let j=0;j<ny;j++)per.push([nx*cell,j*cell]);
    for(let i=nx;i>0;i--)per.push([i*cell,ny*cell]);
    for(let j=ny;j>0;j--)per.push([0,j*cell]);
    for(let k=0;k<per.length;k++){const p=per[k],q=per[(k+1)%per.length];tb.t(cx,cy,0,q[0],q[1],0,p[0],p[1],0);}
  }
  return tb.out();
}

/* Bilinear sample from a grid (w*h, row 0 = top). u,v in [0,1]. */
function sampleGrid(g,u,v){
  const x=clamp(u,0,1)*(g.w-1),y=clamp(v,0,1)*(g.h-1);
  const x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(x0+1,g.w-1),y1=Math.min(y0+1,g.h-1),fx=x-x0,fy=y-y0,d=g.data;
  return lerp(lerp(d[y0*g.w+x0],d[y0*g.w+x1],fx),lerp(d[y1*g.w+x0],d[y1*g.w+x1],fx),fy);
}

/* Shape masks in normalised coords (u,v in 0..1, square footprint) */
function shapeTest(shape,u,v){
  const x=u-.5,y=v-.5;
  if(shape==='circle')return x*x+y*y<=.25;
  if(shape==='hex'){const qx=Math.abs(x),qy=Math.abs(y),R=.5,s=Math.sqrt(3);return qy<=R*s/2&&s*qx+qy<=s*R;}
  return true;
}

/* ---------- noise ---------- */
function hash2(i,j,seed){let h=(i*374761393+j*668265263+seed*1442695041)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967295;}
function vnoise(x,y,seed){
  const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return lerp(lerp(hash2(i,j,seed),hash2(i+1,j,seed),u),lerp(hash2(i,j+1,seed),hash2(i+1,j+1,seed),u),v);
}
function fbm(x,y,seed,oct=6){let a=.5,f=1,s=0,n=0;for(let k=0;k<oct;k++){s+=a*vnoise(x*f,y*f,seed+k*17);n+=a;a*=.5;f*=2.03;}return s/n;}

async function fetchTerrain(lat,lon,areaKm,target=420){
  const C=40075016.686,m=areaKm*1000,cos=Math.cos(lat*Math.PI/180);
  let z=clamp(Math.ceil(Math.log2(C*cos*target/(256*m))),1,15),tiles,cx,cy,half,world;
  for(;;){

    tiles={tx0,tx1,ty0,ty1};

  }
  const {tx0,tx1,ty0,ty1}=tiles,n=2**z,cw=(tx1-tx0+1)*256,ch=(ty1-ty0+1)*256;
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const ctx=cv.getContext('2d',{willReadFrequently:true});
  const jobs=[];
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){
    const x=((tx%n)+n)%n,y=clamp(ty,0,n-1);
    jobs.push(fetch(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`,{mode:'cors'})
      .then(r=>{if(!r.ok)throw new Error('tile '+r.status);return r.blob();}).then(b=>createImageBitmap(b))
      .then(img=>ctx.drawImage(img,(tx-tx0)*256,(ty-ty0)*256)));

  await Promise.all(jobs);
  const px=ctx.getImageData(0,0,cw,ch).data,mos=new Float32Array(cw*ch);
  for(let i=0,k=0;i<mos.length;i++,k+=4)mos[i]=px[k]*256+px[k+1]+px[k+2]/256-32768;
  const N=Math.min(512,Math.max(64,Math.ceil(2*half)+1)),data=new Float32Array(N*N),g={w:cw,h:ch,data:mos};

/* Backlit preview texture: brightness = how much light a lithophane's thickness would pass

   H is a (w×h) grid of thicknesses; texture rows run top-to-bottom in the same order as H. */
function backlitTexture(H,w,h,minT,maxT){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const x=cv.getContext('2d'),img=x.createImageData(w,h),span=Math.max(maxT-minT,1e-6);

function roundRectPath(x,X,Y,W,H,r){r=Math.max(0,Math.min(r,W/2,H/2));x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}

async function buildText(p){
  const f=FONTS[p.font]||FONTS.archivo,fam=`${f.weight} {S}px "${f.family}", "Arial Black", sans-serif`;
  try{await document.fonts.load(fam.replace('{S}',64),p.text||'A');}catch(e){}
  const lines=(p.text||' ').split('\n');while(lines.length>1&&!lines[lines.length-1].trim())lines.pop();
  const mc=document.createElement('canvas').getContext('2d');mc.font=fam.replace('{S}',100);
  const widths=lines.map(l=>mc.measureText(l).width/100*p.size);
  const lineH=p.size*1.12,textW=Math.max(1,...widths),textH=lines.length*lineH;
  const style=p.plate,pad=style==='letters'?1:p.pad,loop=p.loop&&style!=='letters',holes=p.holes&&style==='plate';
  const loopR=5.5,holeR=2.4,side=holes?9:0;
  let x0=pad+side+(loop?(style==='contour'?2*loopR-2.5:2*loopR-1):0);
  let W=x0+textW+pad+side,H=Math.max(textH+2*pad,loop?2*loopR+2:0);
  const cell=cellFor(p.detail,W,H,700),nx=Math.ceil(W/cell),ny=Math.ceil(H/cell);W=nx*cell;H=ny*cell;
  const cx=x0+textW/2,top=(H-textH)/2;
  const drawText=(x,extraStroke)=>{
    x.font=fam.replace('{S}',p.size);x.textAlign='center';x.textBaseline='middle';
    lines.forEach((l,k)=>{const y=top+lineH*(k+0.5)+p.size*0.04;if(extraStroke){x.strokeText(l,cx,y);}x.fillText(l,cx,y);});
  };
  const mk=(w,h,off)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.setTransform(1/cell,0,0,1/cell,off,off);x.fillStyle='#fff';x.strokeStyle='#fff';x.lineJoin='round';x.lineCap='round';return x;};
  // footprint mask (cell centres)
  const mx=mk(nx,ny,0);
  if(style==='plate'){roundRectPath(mx,0,0,W,H,p.radius);mx.fill();}
  else if(style==='contour'){mx.lineWidth=2*pad;drawText(mx,true);}
  else{drawText(mx,false);}
  if(loop){mx.beginPath();mx.arc(loopR,H/2,loopR,0,TAU);mx.fill();if(style==='contour')mx.fillRect(loopR,H/2-loopR*0.7,x0-loopR,loopR*1.4);}
  mx.globalCompositeOperation='destination-out';
  if(loop){mx.beginPath();mx.arc(loopR,H/2,holeR,0,TAU);mx.fill();}
  if(holes){mx.beginPath();mx.arc(side/2+pad*0.25,H/2,2,0,TAU);mx.arc(W-side/2-pad*0.25,H/2,2,0,TAU);mx.fill();}
  const md=mx.getImageData(0,0,nx,ny).data,mask=new Uint8Array(nx*ny);
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)mask[j*nx+i]=md[((ny-1-j)*nx+i)*4+3]>110?1:0;
  // letter heights (vertices)
  const tx=mk(nx+1,ny+1,0.5);drawText(tx,false);
  if(style==='plate'&&p.border){tx.lineWidth=1.6;roundRectPath(tx,1.8,1.8,W-3.6,H-3.6,Math.max(0,p.radius-1.8));tx.stroke();}
  const td=tx.getImageData(0,0,nx+1,ny+1).data,Hh=new Float32Array((nx+1)*(ny+1));
  const eng=p.style==='engraved'&&style!=='letters',depth=eng?Math.min(p.textH,p.thick-0.6):p.textH;
  for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){
    const a=td[((ny-j)*(nx+1)+i)*4+3]/255;
    Hh[j*(nx+1)+i]=style==='letters'?p.thick:eng?p.thick-a*depth:p.thick+a*depth;
  }
  let any=false;for(let i=0;i<mask.length;i++)if(mask[i]){any=true;break;}
  if(!any)throw new Error('Type some text to build the model.');
  const tris=heightfieldSolid(nx,ny,cell,Hh,mask);
  const notes=[['Footprint',`${fmt(W)} × ${fmt(H)} mm`],['Font',f.family]];
  if(style!=='letters'&&!eng)notes.push(['Colour swap at',`Z ${fmt(p.thick,2)} mm`]);
  return {shells:[tris],notes,file:slug(lines.join(' '))};
}

  for(let i=0;i<tris.length;i+=3){tris[i]-=cx;tris[i+1]-=cy;tris[i+2]-=mnz;}
  const b={x:mxx-mnx,y:mxy-mny,z:mxz-mnz};
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(tris,3));
  if(uv)g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.computeVertexNormals();
  if(mesh){mesh.geometry.dispose();mesh.geometry=g;}else{mesh=new THREE.Mesh(g,mat);scene.add(mesh);}
  if(emissiveTex){emissiveTex.dispose();emissiveTex=null;}
  if(res.emissive){emissiveTex=res.emissive;mat.emissiveMap=emissiveTex;mat.emissive.set(0xffffff);mat.emissiveIntensity=1.2;}
  else{mat.emissiveMap=null;mat.emissive.set(0x000000);mat.emissiveIntensity=0;}
  mat.needsUpdate=true;
  S.tris=tris;S.bbox=b;S.fileBase=res.file||MODEL_BY_ID[S.model].id;
  if(S.needFit){fitCamera(b);S.needFit=false;}
  renderStats(b,tris.length/9,vol);
  $('#readout').innerHTML=(res.notes||[]).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  const badge=$('#mBadge');badge.hidden=!res.badge;badge.textContent=res.badge||'';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderStats(b,n,vol){
  const P=PRINTERS.find(p=>p.id===S.printer);
  const fits=((b.x<=P.w&&b.y<=P.d)||(b.x<=P.d&&b.y<=P.w))&&b.z<=P.h;
  const cm3=vol/1000;
  $('#stats').innerHTML=
    `<div class="stat"><span class="k">Size</span><span class="v">${fmt(b.x)} × ${fmt(b.y)} × ${fmt(b.z)} mm</span></div>`+
    `<div class="stat"><span class="k">Triangles</span><span class="v">${n.toLocaleString('en-US')}</span></div>`+
    `<div class="stat"><span class="k">Volume</span><span class="v">${fmt(cm3,1)} cm³</span></div>`+
    `<div class="stat"><span class="k">PLA if solid</span><span class="v">≈ ${fmt(cm3*1.24,0)} g</span></div>`+
    `<span class="pill ${fits?'ok':'bad'}">${fits?'Fits '+P.short:'Too big for '+P.short}</span>`;
}

/* ---------- build pipeline ---------- */
let token=0,timer=null;
const ui={busy(t){const e=$('#busy');e.hidden=!t;if(t)e.textContent=t;}};
function schedule(ms=80){clearTimeout(timer);timer=setTimeout(rebuild,ms);}
async function rebuild(){
  const my=++token,m=MODEL_BY_ID[S.model],p=S.vals[m.id];
  ui.busy('Generating');hideMsg();
  await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
  if(my!==token)return;
  try{const res=await m.build(p,ui);if(my!==token)return;applyResult(res);}
  catch(e){if(my===token){showMsg(e.message||String(e));console.error(e);}}
  finally{if(my===token)ui.busy(null);}
}
function showMsg(t){$('#msgText').textContent=t;$('#msg').hidden=false;}
function hideMsg(){$('#msg').hidden=true;}
$('#msgX').onclick=hideMsg;
let toastT=null;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,3200);}

/* ---------- controls ---------- */
for(const m of MODELS){S.vals[m.id]={};for(const p of m.params)if('value' in p)S.vals[m.id][p.id]=p.value;}

function renderCats(){
  $('#cats').innerHTML=CATS.map(c=>`<button class="cat" data-cat="${c.id}" aria-pressed="${c.id===S.cat}"><svg viewBox="0 0 24 24" aria-hidden="true">${c.icon}</svg>${c.label}</button>`).join('');
  $('#cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    if(S.cat===b.dataset.cat)return;S.cat=b.dataset.cat;S.model=MODELS.find(m=>m.cat===S.cat).id;S.needFit=true;renderAll();schedule(0);
  });
}
function renderModels(){
  const list=MODELS.filter(m=>m.cat===S.cat);
  $('#models').innerHTML=list.map(m=>`<button class="chip" data-m="${m.id}" aria-pressed="${m.id===S.model}">${m.name}</button>`).join('');
  $('#models').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(S.model===b.dataset.m)return;S.model=b.dataset.m;S.needFit=true;renderAll();schedule(0);});
}
function renderAll(){
  renderCats();renderModels();renderParams();
  const m=MODEL_BY_ID[S.model];$('#mTitle').textContent=m.name;$('#tips').innerHTML=m.tip||'';$('#readout').innerHTML='';
}
function renderParams(){
  const m=MODEL_BY_ID[S.model],v=S.vals[m.id],root=$('#params');root.innerHTML='';let group=null;
  for(const p of m.params){
    if(p.show&&!p.show(v))continue;
    if(p.group&&p.group!==group){group=p.group;const h=document.createElement('div');h.className='group';h.textContent=group;root.appendChild(h);}
    root.appendChild(control(m,p,v));
  }
}
function changed(p,m){
  if(p.rerender)renderParams();
  schedule(p.refetch&&S.vals[m.id].source==='map'&&S.place?700:(p.type==='range'?60:0));
}
function control(m,p,v){
  const row=document.createElement('div');row.className='row';const id=`p-${m.id}-${p.id}`;
  if(p.type==='range'){
    row.innerHTML=`<label for="${id}"><span>${p.label}</span><span><input class="num" type="number" id="${id}-n" aria-label="${p.label} value" min="${p.min}" max="${p.max}" step="${p.step}" value="${v[p.id]}"><span class="unit">${p.unit||''}</span></span></label><input type="range" id="${id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${v[p.id]}">`;
    const r=row.querySelector('input[type=range]'),n=row.querySelector('.num');
    r.oninput=()=>{v[p.id]=+r.value;n.value=r.value;changed(p,m);};
    n.onchange=()=>{let x=+n.value;if(!isFinite(x))x=p.value;x=clamp(x,p.min,p.max);v[p.id]=x;n.value=x;r.value=x;changed(p,m);};
  }else if(p.type==='select'){
    row.innerHTML=`<label for="${id}">${p.label}</label><select id="${id}">${p.options.map(([k,l])=>`<option value="${k}"${String(v[p.id])===k?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
    const s=row.querySelector('select');s.onchange=()=>{v[p.id]=s.value;if(p.id==='source')S.needFit=true;changed(p,m);};
  }else if(p.type==='check'){
    row.className='row check';row.innerHTML=`<input type="checkbox" id="${id}"${v[p.id]?' checked':''}><label for="${id}">${p.label}</label>`;
    const c=row.querySelector('input');c.onchange=()=>{v[p.id]=c.checked;changed(p,m);};
  }else if(p.type==='textarea'){
    row.innerHTML=`<label for="${id}">${p.label}</label><textarea id="${id}" rows="2" spellcheck="false">${esc(v[p.id])}</textarea><span class="hint">Press Enter for a second line.</span>`;
    const t=row.querySelector('textarea');t.oninput=()=>{v[p.id]=t.value;schedule(250);};
  }else if(p.type==='presets'){
    row.innerHTML=`<div class="presets">${p.items.map((it,i)=>`<button class="chip" data-i="${i}">${it.label}</button>`).join('')}</div>`;
    row.querySelectorAll('button').forEach(b=>b.onclick=()=>{Object.assign(v,p.items[+b.dataset.i].set);S.needFit=true;renderParams();schedule(0);});
  }else if(p.type==='image'){
    const cur=p.target==='photo'?(S.photo.sample?'Sample photo (generated)':S.photo.name):(S.heightmapImg?S.heightmapName:'No image yet');
    row.innerHTML=`<span class="lab">${p.label}</span><div class="file"><label class="btn" for="${id}">Choose image…</label><input type="file" id="${id}" accept="image/*" hidden><span class="fname">${esc(cur)}</span></div><span class="hint">Or drop an image onto the preview.</span>`;
    const f=row.querySelector('input');f.onchange=()=>{if(f.files[0])loadImage(f.files[0],p.target);};
  }else if(p.type==='place'){
    row.innerHTML=`<label for="place-q">Place or coordinates</label>
      <div class="search"><input type="search" id="place-q" placeholder="Pão de Açúcar, or -22.95, -43.16" autocomplete="off"><button class="btn" id="place-go">Search</button></div>
      <div class="results" id="place-results"></div><p class="status" id="place-status"></p>`;
    const q=row.querySelector('#place-q'),go=row.querySelector('#place-go'),st=row.querySelector('#place-status'),res=row.querySelector('#place-results');
    if(S.place){st.className='status ok';st.textContent=`Loaded: ${S.place.name.split(',').slice(0,2).join(',')} (${fmt(S.place.lat,4)}, ${fmt(S.place.lon,4)})`;}
    else if(IN_CLAUDE){st.textContent='Inside claude.ai the map servers are out of reach, so place search works in the desktop copy of Layerworks. Here, use Sample island or Heightmap image.';}
    else st.textContent='Search a mountain, city or park, or paste latitude, longitude.';
    const pick=r=>{S.place=r;S.mapCache=null;S.needFit=true;res.innerHTML='';renderParams();schedule(0);};
    const run=async()=>{
      const text=q.value.trim();if(!text)return;st.className='status';st.textContent='Searching…';res.innerHTML='';
      try{
        const list=await geocode(text);
        if(!list.length){st.textContent='No matches. Try a nearby town or paste coordinates.';return;}
        if(list.length===1){pick(list[0]);return;}
        st.textContent='Choose a result:';
        list.forEach(r=>{const b=document.createElement('button');b.innerHTML=`${esc(r.name)}<span class="co">${fmt(r.lat,4)}, ${fmt(r.lon,4)}</span>`;b.onclick=()=>pick(r);res.appendChild(b);});
      }catch(e){st.className='status err';st.textContent=IN_CLAUDE?'Search can’t reach the map service from inside claude.ai. Paste coordinates in the desktop copy instead.':'The place search service didn’t respond. Paste coordinates like 45.83, 6.86 instead.';}
    };
    go.onclick=run;q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run();}};
  }
  return row;
}
async function loadImage(file,target){
  try{
    const bmp=await createImageBitmap(file);
    if(target==='photo')S.photo={src:bmp,name:file.name.replace(/\.\w+$/,''),sample:false};
    else{S.heightmapImg=bmp;S.heightmapName=file.name;S.hmCache=null;}
    S.needFit=true;renderParams();schedule(0);
  }catch(e){showMsg('That file couldn’t be read as an image. Try a PNG or JPEG.');}
}
stage.addEventListener('dragover',e=>{e.preventDefault();});
stage.addEventListener('drop',e=>{
  e.preventDefault();const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith('image/'));if(!f)return;
  if(S.cat==='terrain'){S.vals.terrain.source='upload';loadImage(f,'heightmap');}
  else{if(S.cat!=='photo'){S.cat='photo';S.model='litho';renderAll();}loadImage(f,'photo');}
});

/* ---------- toolbar ---------- */
$('#printer').innerHTML=PRINTERS.map(p=>`<option value="${p.id}"${p.id===S.printer?' selected':''}>${p.label}</option>`).join('');
$('#printer').onchange=e=>{S.printer=e.target.value;store.set('printer',S.printer);buildPlate();if(S.bbox){renderStats(S.bbox,S.tris.length/9,Math.abs(signedVolume(S.tris)));}};
function renderSwatches(){
  $('#swatches').innerHTML=FILAMENTS.map(f=>`<button class="sw" style="background:${f.hex}" data-f="${f.id}" aria-pressed="${f.id===S.filament}" title="${f.name}" aria-label="${f.name}"></button>`).join('');
  $('#swatches').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{S.filament=b.dataset.f;store.set('filament',S.filament);setFilament();renderSwatches();});
}
function setFilament(){mat.color.set(FILAMENTS.find(f=>f.id===S.filament).hex);}
const dlBtn=$('#dl');
if(IN_CLAUDE)dlBtn.title='Saves a .zip containing the STL file';
dlBtn.onclick=async()=>{
  if(!S.tris)return;dlBtn.disabled=true;
  try{
    const name=S.fileBase+'.stl',stl=toSTL(S.tris,'Layerworks '+name);
    let dl=null;if(IN_CLAUDE){try{dl=await window.claude.use('downloads');}catch(e){dl=null;}}
    if(dl){
      try{await dl.save({filename:S.fileBase+'.zip',data:new Blob([zipOne(name,stl)])});toast(`Saved ${S.fileBase}.zip with ${name} inside`);}
      catch(e){if(e&&e.code==='declined')return;showMsg(e&&e.code==='rate_limited'?'A save prompt is already open. Finish that one first.':'Downloads aren’t available in this view. Open the artifact in claude.ai to save files.');}
    }else if(IN_CLAUDE){showMsg('Downloads aren’t available in this view. Open the artifact in claude.ai to save files.');}
    else{
      const url=URL.createObjectURL(new Blob([stl],{type:'model/stl'})),a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Saved '+name);
    }
  }finally{dlBtn.disabled=false;}
};

function refreshTheme(){buildPlate();}
const narrowMQ=window.matchMedia('(max-width:860px)');
function placeTools(){const t=narrowMQ.matches?$('#mtools'):$('.actions');t.prepend($('#swatches'));t.prepend($('#printer'));}
narrowMQ.addEventListener('change',placeTools);placeTools();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',refreshTheme);
new MutationObserver(refreshTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

buildPlate();setFilament();renderSwatches();renderAll();resize();schedule(0);

</script>
</body>
